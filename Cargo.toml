[package]
name = "flipper-pc-monitor-backend-usb"
version = "0.2.0"
edition = "2021"

[dependencies]
bincode = "1.3.3"
serialport = "4.2.2" # Replaces btleplug
sysinfo = "0.30.5"
serde = { version = "1.0.164", features = ["derive"] }
serde_json = "1.0"
xmltojson = { git = "https://github.com/rtyler/xmltojson", version = "0.1.3" }
rodio = "0.17.3"

[target.'cfg(target_os = "windows")'.dependencies]
wmi = "0.14"
